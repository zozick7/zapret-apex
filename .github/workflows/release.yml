name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build ZIP
        shell: pwsh
        run: ./build.ps1
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = (Get-Content -LiteralPath RELEASE.md -Raw).TrimEnd()
          $buildUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          @($notes, '', "[Журнал сборки]($buildUrl)") | Set-Content -LiteralPath dist/release-notes.md -Encoding utf8
          gh release create $env:GITHUB_REF_NAME dist/zapret-apex.zip dist/SHA256SUMS.txt --verify-tag --title $env:GITHUB_REF_NAME --notes-file dist/release-notes.md
